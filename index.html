<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Hub — Pick a quiz</title>
  <meta name="description" content="A collection of quiz-style web apps that match you to an ideal pick based on your answers." />
  <link rel="stylesheet" href="assets/hub.css" />
</head>
<body>
  <header class="hub-header">
    <div class="wrap">
      <h1>🎯 Quiz Hub</h1>
      <p class="tagline">A growing collection of quiz-style apps that match you to an ideal pick based on a few quick answers. Choose one to get started.</p>
    </div>
  </header>

  <main class="wrap">
    <div id="quiz-grid" class="quiz-grid"></div>
  </main>

  <footer class="hub-footer">
    <div class="wrap">
      <p>Built as a static site and hosted on GitHub Pages. Each quiz is a self-contained
        single-page app in its own folder. Source on
        <a href="https://github.com/jstephenperry/vibe-code-quiz-junk">GitHub</a>.</p>
    </div>
  </footer>

  <script src="assets/quizzes.js"></script>
  <script src="assets/hub.js"></script>
</body>
</html>
